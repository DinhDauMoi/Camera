name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore

      - name: Build release APK with Gradle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/LievisCam-${{ github.ref_name }}.apk

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          name: Lievis Cam ${{ github.ref_name }}
          files: release-assets/LievisCam-${{ github.ref_name }}.apk
          body: |
            - Đổi model nhận diện sang YOLOv12n: nhẹ (~10MB), phân tích nhanh hơn, chuẩn hơn trước
            - Warmup GPU: hết khựng khi bật AI lần đầu
            - Chữ đen trên pill hồng: tab, nút zoom, chip filter đã đọc rõ
            - AI mặc định tắt mỗi lần mở app, cần thì bật tay
            - Sửa tên hiển thị còn sót thành Lievis Cam
          generate_release_notes: false
          draft: false
          prerelease: false
