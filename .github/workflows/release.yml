name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore

      - name: Build release APK with Gradle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/LievisCam-${{ github.ref_name }}.apk

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          name: Lievis Cam ${{ github.ref_name }}
          files: release-assets/LievisCam-${{ github.ref_name }}.apk
          body: |
            - Tối ưu auto-zoom liên tục: lấp "vùng chết" cho chủ thể cỡ trung bình (18% - 60% khung hình) tự động phóng to mượt mà
            - Giao diện Liquid Glass Hồng Phấn & Đen: diện mạo sang trọng với tone accent hồng phấn kết hợp nền đen huyền bí
            - Độ tương phản chữ tab sắc nét: chuyển chữ tab active sang màu hồng phấn cho trải nghiệm đọc rõ ràng, nổi bật
            - Tinh chỉnh đồng bộ: cập nhật toàn diện màu sắc cho vòng ngắm, mũi tên dẫn hướng, nút điều khiển và hộp thoại
          generate_release_notes: false
          draft: false
          prerelease: false
